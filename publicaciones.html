<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Ads HD Pro | OrganizaGT</title>
    
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3061/3061341.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        :root { --primary: #F47C20; --dark: #1C3F60; --bg: #f4f7f6; }
        
        /* Layout Base */
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; display: flex; height: 100vh; flex-direction: row; }
        
        /* Estilo Responsive del Sidebar */
        .sidebar { width: 400px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; box-shadow: 2px 0 10px rgba(0,0,0,0.05); z-index: 10; }
        .sidebar-header { padding: 25px 20px; background: var(--dark); color: white; text-align: center; }
        .sidebar-content { padding: 20px; overflow-y: auto; flex-grow: 1; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 800; font-size: 0.7rem; color: #666; margin-bottom: 5px; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 8px; font-size: 0.9rem; box-sizing: border-box; }
        
        .btn { border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 8px; display: block; text-align: center; text-decoration: none; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-info { background: var(--dark); color: white; font-size: 0.75rem; }

        .workspace { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 40px; background: #cbd5e0; position: relative; }
        .canvas-card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 95%; margin-bottom: 20px; }
        canvas { max-width: 100%; height: auto; border-radius: 8px; display: block; background: #fff; }

        #copyTextArea { height: 120px; font-size: 0.8rem; border: 1px solid #ddd; background: white; resize: none; margin-bottom: 8px; }

        @media (max-width: 850px) {
            body { flex-direction: column; overflow: auto; height: auto; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #ddd; height: auto; }
            .workspace { width: 100%; height: auto; padding: 20px 0; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <h2 style="margin:0; font-size: 1.2rem;">MARKETING TOOL HD</h2>
        <p style="margin:5px 0 0; opacity: 0.7; font-size: 0.7rem;">OrganizaGT Business</p>
    </div>
    
    <div class="sidebar-content">
        <div class="form-group">
            <label>URL del Catálogo (Google Sheets CSV)</label>
            <input type="text" id="csvUrl" value="https://docs.google.com/spreadsheets/d/e/2PACX-1vTaqvK-jA57T96GvMh4Y_xYtq1pS6mS_v96Y6fMh-u8A/pub?output=csv">
        </div>
        <button class="btn btn-info" onclick="cargarCatalogo()">Sincronizar Catálogo</button>

        <div class="form-group">
            <label>Seleccionar Producto</label>
            <select id="productSelect" onchange="actualizarInterfaz()">
                <option value="">-- Cargar Catálogo primero --</option>
            </select>
        </div>

        <div class="form-group">
            <label>Copy Publicitario</label>
            <textarea id="copyTextArea" placeholder="Aquí aparecerá el texto..."></textarea>
            <button class="btn btn-primary" onclick="copiarTexto()">Copiar Texto</button>
        </div>

        <button class="btn btn-primary" onclick="descargarTodo()">Descargar Publicidades</button>
    </div>
</div>

<div class="workspace">
    <div class="canvas-card"><canvas id="canvas1" width="1080" height="1080"></canvas></div>
    <div class="canvas-card"><canvas id="canvas2" width="1080" height="1080"></canvas></div>
</div>

<script>
    // CAMBIO CLAVE: Cambiamos corsproxy.io por AllOrigins que es más estable y gratuito
    const PROXY = "https://api.allorigins.win/raw?url=";
    let productosGlobal = [];

    async function cargarCatalogo() {
        const url = document.getElementById('csvUrl').value;
        try {
            // El CSV de Google no necesita proxy
            const res = await fetch(url + "&cache=" + Date.now());
            const text = await res.text();
            const rows = text.split('\n').slice(1);
            
            productosGlobal = rows.map(row => {
                const cols = row.split(',');
                return {
                    id: cols[0],
                    nombre: cols[1],
                    img: cols[2], // URL de la imagen
                    precio: cols[9],
                    desc: cols[8]
                };
            }).filter(p => p.id);

            const select = document.getElementById('productSelect');
            select.innerHTML = '<option value="">-- Elige un producto --</option>';
            productosGlobal.forEach(p => {
                let opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = p.nombre;
                select.appendChild(opt);
            });
            alert("Catálogo cargado con éxito");
        } catch (e) {
            alert("Error cargando el catálogo");
        }
    }

    async function actualizarInterfaz() {
        const id = document.getElementById('productSelect').value;
        const p = productosGlobal.find(x => x.id === id);
        if (!p) return;

        document.getElementById('copyTextArea').value = `🔥 ${p.nombre} 🔥\n\n${p.desc}\n\n💰 Precio: Q${p.precio}\n\n¡Pídelo aquí! 👇`;

        await renderizarPublicidad('canvas1', p, 1);
        await renderizarPublicidad('canvas2', p, 2);
    }

    async function renderizarPublicidad(id, p, estilo) {
        const canvas = document.getElementById(id);
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0,0,1080,1080);

        // Fondo blanco
        ctx.fillStyle = "white";
        ctx.fillRect(0,0,1080,1080);

        try {
            const img = await cargarImg(p.img);
            // Dibujamos la imagen centrada
            const ratio = Math.min(800 / img.width, 800 / img.height);
            const w = img.width * ratio;
            const h = img.height * ratio;
            ctx.drawImage(img, (1080 - w) / 2, (1080 - h) / 2, w, h);

            // Texto de ejemplo
            ctx.fillStyle = "#1C3F60";
            ctx.font = "bold 50px Inter";
            ctx.textAlign = "center";
            ctx.fillText(p.nombre, 540, 100);
            
            ctx.fillStyle = "#F47C20";
            ctx.font = "bold 80px Inter";
            ctx.fillText(`Q${p.precio}`, 540, 1000);
        } catch (e) {
            console.error("Error cargando imagen:", e);
        }
    }

    function cargarImg(url) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.crossOrigin = "anonymous";
            // Lógica de carga: si falla directamente, usamos el proxy
            img.src = url;
            
            img.onload = () => resolve(img);
            img.onerror = () => {
                // Si la carga normal falla (CORS/403), intentamos con AllOrigins
                console.warn("Reintentando carga con proxy...");
                img.src = PROXY + encodeURIComponent(url);
                img.onload = () => resolve(img);
                img.onerror = (err) => reject(err);
            };
        });
    }

    function copiarTexto() {
        const copyText = document.getElementById("copyTextArea");
        copyText.select();
        document.execCommand("copy");
        alert("Texto copiado");
    }

    function descargarTodo() {
        const pSelect = document.getElementById('productSelect');
        const name = pSelect.options[pSelect.selectedIndex].text;
        document.querySelectorAll('canvas').forEach((c, i) => {
            const link = document.createElement('a');
            link.download = `${name}_${i+1}.png`;
            link.href = c.toDataURL();
            link.click();
        });
    }
</script>

</body>
</html>
