<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Ads HD Pro | GuateCocina</title>
    
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3061/3061341.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        :root { --primary: #F47C20; --dark: #1C3F60; --bg: #f4f7f6; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; display: flex; height: 100vh; flex-direction: row; }
        .sidebar { width: 400px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; box-shadow: 2px 0 10px rgba(0,0,0,0.05); z-index: 10; }
        .sidebar-header { padding: 25px 20px; background: var(--dark); color: white; text-align: center; }
        .sidebar-content { padding: 20px; overflow-y: auto; flex-grow: 1; }
        .main-view { flex: 1; overflow-y: auto; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .control-group { margin-bottom: 20px; }
        label { display: block; font-weight: 800; margin-bottom: 8px; font-size: 0.85rem; color: var(--dark); text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.9rem; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #e06b10; }
        .btn-dark { background: var(--dark); color: white; }
        .grid-canvas { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; max-width: 1000px; }
        canvas { background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; height: auto; }
        .copy-box { background: #eef2f5; padding: 15px; border-radius: 12px; border: 1px solid #cfd9e0; }
        #copyTextArea { height: 150px; font-family: monospace; font-size: 0.85rem; background: white; resize: none; }
        @media (max-width: 900px) { body { flex-direction: column; height: auto; } .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #ddd; } .grid-canvas { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-header">
        <h2 style="margin:0; font-size: 1.2rem;"><i class="bi bi- megaphone"></i> Ad Generator Pro</h2>
        <p style="margin:5px 0 0; opacity: 0.8; font-size: 0.8rem;">GuateCocina - Edición 2026</p>
    </div>
    
    <div class="sidebar-content">
        <div class="control-group">
            <label>1. Enlace del Catálogo (CSV)</label>
            <input type="text" id="csvUrl" value="https://docs.google.com/spreadsheets/d/e/2PACX-1vTaqvK-jA57T96GvMh4Y_xYtq1pS6mS_v96Y6fMh-u8A/pub?output=csv">
            <button class="btn btn-dark" style="margin-top:10px" onclick="cargarCatalogo()">
                <i class="bi bi-arrow-repeat"></i> Sincronizar Catálogo
            </button>
        </div>

        <div class="control-group">
            <label>2. Seleccionar Producto</label>
            <select id="productSelect" onchange="actualizarInterfaz()">
                <option value="">-- Esperando catálogo --</option>
            </select>
        </div>

        <div class="control-group">
            <label>3. Copy de Publicidad</label>
            <div class="copy-box">
                <textarea id="copyTextArea" readonly></textarea>
                <button class="btn btn-primary" style="margin-top:10px" onclick="copiarAlPortapapeles()">
                    <i class="bi bi-clipboard"></i> Copiar Texto
                </button>
            </div>
        </div>

        <button class="btn btn-dark" onclick="descargarTodo()">
            <i class="bi bi-download"></i> Descargar Todas las Imágenes
        </button>
    </div>
</aside>

<main class="main-view">
    <div class="grid-canvas">
        <canvas id="canvas1" width="1080" height="1080"></canvas>
        <canvas id="canvas2" width="1080" height="1080"></canvas>
        <canvas id="canvas3" width="1080" height="1080"></canvas>
        <canvas id="canvas4" width="1080" height="1080"></canvas>
    </div>
</main>

<script>
    // Usamos allorigins como proxy de emergencia para imágenes si fallan por CORS
    const PROXY = "https://api.allorigins.win/raw?url=";
    const LOGO_URL = "img/GuateCocina.png"; 
    let productosGlobal = [];

    function csvToArray(strData) {
        const objPattern = new RegExp(("(\\,|\\r?\\n|\\r|^)(?:\"([^\"]*(?:\"\"[^\"]*)*)\"|([^\\,\\r\\n]*))"), "gi");
        let arrData = [[]], arrMatches = null;
        while (arrMatches = objPattern.exec(strData)) {
            let strMatchedDelimiter = arrMatches[1];
            if (strMatchedDelimiter.length && (strMatchedDelimiter != ",")) arrData.push([]);
            let strMatchedValue = arrMatches[2] ? arrMatches[2].replace(new RegExp("\"\"", "g"), "\"") : arrMatches[3];
            arrData[arrData.length - 1].push(strMatchedValue);
        }
        return arrData;
    }

    async function cargarCatalogo() {
        const url = document.getElementById('csvUrl').value;
        try {
            // Fetch directo a Google Sheets (no necesita proxy para CSV)
            const res = await fetch(url + "&t=" + Date.now());
            if (!res.ok) throw new Error("No se pudo obtener el catálogo");
            const text = await res.text();
            const rawRows = csvToArray(text);
            
            productosGlobal = rawRows.slice(1).filter(r => r.length > 1 && r[0] !== "").map(r => ({
                id: r[0],
                tituloDisplay: (r[1] || "").split('|')[0].trim(),
                tituloGancho: (r[1] || "").split('|')[1] ? (r[1] || "").split('|')[1].trim() : (r[1] || "").trim(),
                imgP: r[2],
                imgG: r[3],
                cat: r[5],
                subCat: r[7],
                desc: r[8],
                precio: r[9]
            }));

            const select = document.getElementById('productSelect');
            select.innerHTML = '<option value="">-- Elige un producto --</option>';
            productosGlobal.forEach(p => {
                let opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = p.tituloDisplay;
                select.appendChild(opt);
            });
            alert("✅ Catálogo sincronizado correctamente.");
        } catch (e) {
            alert("❌ Error: " + e.message);
        }
    }

    async function actualizarInterfaz() {
        const id = document.getElementById('productSelect').value;
        const p = productosGlobal.find(x => x.id === id);
        if (!p) return;

        // Actualizar Copy
        document.getElementById('copyTextArea').value = generarCopy(p);
        
        // Renderizar las 4 versiones
        for(let i=1; i<=4; i++) {
            await renderizarPublicidad(`canvas${i}`, p, i);
        }
    }

    function generarCopy(p) {
        return `🔥 ${p.tituloGancho} 🔥\n\n${p.desc}\n\n✅ Calidad Profesional\n🚚 Envíos a toda Guatemala\n💰 Precio: Q${p.precio}\n\n¡Pide el tuyo aquí! 👇\nwa.me/50241084481`;
    }

    async function renderizarPublicidad(canvasId, p, estilo) {
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, 1080, 1080);

        // Fondo
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, 1080, 1080);

        try {
            // Cargar Imagen de producto
            const imgUrl = estilo <= 2 ? p.imgP : p.imgG;
            const img = await cargarImg(imgUrl);
            
            // Dibujar imagen centrada
            const scale = Math.min(800 / img.width, 800 / img.height);
            const w = img.width * scale;
            const h = img.height * scale;
            ctx.drawImage(img, (1080 - w) / 2, (1080 - h) / 2 - 50, w, h);

            // Adornos según estilo
            ctx.fillStyle = "#F47C20";
            if(estilo === 1) ctx.fillRect(0, 950, 1080, 130);
            if(estilo === 2) ctx.fillRect(0, 0, 1080, 150);
            
            // Texto Precio
            ctx.fillStyle = "#1C3F60";
            ctx.font = "bold 80px Inter";
            ctx.textAlign = "center";
            ctx.fillText(`Q${p.precio}`, 540, 1000);

            // Título
            ctx.font = "bold 40px Inter";
            ctx.fillText(p.tituloDisplay.toUpperCase(), 540, 100);

            // Logo
            const logo = await cargarImg(LOGO_URL);
            ctx.drawImage(logo, 850, 40, 180, 180 * (logo.height / logo.width));

        } catch (e) {
            console.error("Error en render:", e);
        }
    }

    function cargarImg(url) {
        return new Promise((res, rej) => {
            const img = new Image();
            img.crossOrigin = "anonymous";
            // Si la URL es externa, usamos el proxy para evitar problemas de canvas
            img.src = (url.startsWith('http') && !url.includes(location.hostname)) ? PROXY + encodeURIComponent(url) : url;
            img.onload = () => res(img);
            img.onerror = () => res(new Image()); // Devolver imagen vacía si falla para no romper el ciclo
        });
    }

    function copiarAlPortapapeles() {
        const area = document.getElementById('copyTextArea');
        area.select();
        document.execCommand("copy");
        alert("📋 Texto copiado.");
    }

    function descargarTodo() {
        const pSelect = document.getElementById('productSelect');
        if (pSelect.value === "") return alert("Selecciona un producto.");
        
        const productName = pSelect.options[pSelect.selectedIndex].text.replace(/[^a-z0-9]/gi, '_').toLowerCase();
        document.querySelectorAll('canvas').forEach((canvas, i) => {
            const link = document.createElement('a');
            link.download = `${productName}_ads_${i+1}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    }
</script>
</body>
</html>
